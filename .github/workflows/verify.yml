name: Verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check Go module files
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Run Go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -count=1 ./...

      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Check browser JavaScript syntax
        run: node --check web/app.js

      - name: Validate example configuration
        run: python3 -m json.tool vicuna.example.json >/dev/null

      - name: Smoke-test the build
        shell: bash
        run: |
          go build -trimpath -buildvcs=false -ldflags="-X main.version=ci" -o "$RUNNER_TEMP/vicuna" .
          "$RUNNER_TEMP/vicuna" -version | grep -Fx "vicuna ci"

      - name: Cross-compile macOS builds
        shell: bash
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build \
              -trimpath \
              -buildvcs=false \
              -ldflags="-s -w -X main.version=ci" \
              -o "$RUNNER_TEMP/vicuna-darwin-$arch" \
              .
          done

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Windows code
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test Windows GUI release
        env:
          CGO_ENABLED: "0"
        run: |
          $binary = Join-Path $env:RUNNER_TEMP 'vicuna.exe'
          go build -trimpath -buildvcs=false '-ldflags=-s -w -H windowsgui -X main.version=ci' -o $binary .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = & $binary -version | Out-String
          if ($LASTEXITCODE -ne 0 -or $output.Trim() -ne 'vicuna ci') {
            throw "Windows GUI version output failed: $output"
          }
          $help = & $binary -help | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch '-console') {
            throw "Windows GUI help output failed: $help"
          }
